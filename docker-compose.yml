# Operator smoke stack: Postgres + gateway + Traefik.
# See docs/deploy.md for wiring notes and external Traefik coexistence.
#
# Quick start:
#   cp compose.env.example .env   # edit secrets
#   docker compose up -d --build
#   curl -sf http://127.0.0.1:7331/healthz

name: preview-buddy

networks:
  traefik:
    name: traefik
  postgres:
    name: postgres

volumes:
  gateway-data:
  postgres-data:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks:
      - postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pb_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      PB_PG_USER: ${PB_PG_USER:-pb_preview}
      PB_PG_PASSWORD: ${PB_PG_PASSWORD:?set PB_PG_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init-preview-role.sh:/docker-entrypoint-initdb.d/01-preview-role.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-pb_admin} -d ${POSTGRES_DB:-postgres}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  traefik:
    image: traefik:v3.6
    restart: unless-stopped
    networks:
      - traefik
    ports:
      - "${TRAEFIK_HTTP_PORT:-8880}:80"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --log.level=INFO

  gateway:
    build: .
    restart: unless-stopped
    networks:
      - traefik
      - postgres
    ports:
      - "7331:7331"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - gateway-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PB_PREVIEW_POSTGRES_URL: postgres://${POSTGRES_USER:-pb_admin}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-postgres}
      PB_PG_HOST: postgres
      PB_PG_PORT: "5432"
      PB_PG_USER: ${PB_PG_USER:-pb_preview}
      PB_PG_PASSWORD: ${PB_PG_PASSWORD:?set PB_PG_PASSWORD in .env}
      PB_TRAEFIK_NETWORK: traefik
      PB_POSTGRES_NETWORK: postgres
      PB_REGISTRY_URL: ${PB_REGISTRY_URL:-ghcr.io}
      PB_REGISTRY_USER: ${PB_REGISTRY_USER:-anonymous}
      PB_REGISTRY_PASSWORD: ${PB_REGISTRY_PASSWORD:-none}
      PB_ADMIN_TOKEN: ${PB_ADMIN_TOKEN:-}
      PB_FORGE: ${PB_FORGE:-github}
      PB_FORGE_TOKEN: ${PB_FORGE_TOKEN:-}
      PB_STATE_DB_PATH: /data/preview-buddy.db
      PB_PORT: "7331"
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:7331/healthz'); process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
